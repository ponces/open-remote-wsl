name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Package extension
        id: package_vsix
        run: |
          yarn package
          echo ::set-output name=vsix_path::$(ls *.vsix)

          version=$(jq --raw-output '.version' package.json)
          echo ::set-output name=version::$version

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package_vsix.outputs.version }}
          files: ${{ steps.package_vsix.outputs.vsix_path }}

      - name: Publish to Open VSX Registry
        run: |
          npx --yes ovsx publish --packagePath ${{ steps.package_vsix.outputs.vsix_path }}
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
